  <style>
    :root {
      color-scheme: light;

      /* Restrained site mapping: Sand is the only page backdrop accent. */
      --nomadia-link-page: var(--nomadia-raw-white); /* Black on White: 17.07:1. */
      --nomadia-link-frame: var(--nomadia-raw-sand); /* Black on Sand: 13.32:1. */
      --nomadia-link-surface: var(--nomadia-raw-white); /* Black on White: 17.07:1. */
      --nomadia-link-surface-inverse: var(--nomadia-raw-black); /* White on Black: 17.07:1. */
      --nomadia-link-text: var(--nomadia-raw-black);
      --nomadia-link-text-strong: var(--nomadia-raw-black);
      --nomadia-link-text-muted: var(--nomadia-raw-black);
      --nomadia-link-text-inverse: var(--nomadia-raw-white);
      --nomadia-link-border: var(--nomadia-raw-black); /* UI boundary on White: 17.07:1. */
      --nomadia-link-soft-line: var(--nomadia-raw-light-grey); /* Decorative divider only. */
      --nomadia-link-focus-ring: var(--nomadia-raw-black); /* On White: 17.07:1. */
      --nomadia-link-focus-surface: var(--nomadia-raw-black);
      --nomadia-link-focus-text: var(--nomadia-raw-white); /* Interactive inverse exception: 17.07:1. */
      --nomadia-link-status-surface: var(--nomadia-raw-white);
      --nomadia-link-status-text: var(--nomadia-raw-black);
      --nomadia-link-avatar-surface: var(--nomadia-raw-light-grey);
      --nomadia-link-radius: 2px;
      --nomadia-link-gap: 14px;
      --nomadia-link-font-sans: "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--nomadia-link-frame);
      font-family: var(--nomadia-link-font-sans);
      -webkit-font-smoothing: antialiased;
    }

    body {
      position: relative;
      min-height: 100vh;
      margin: 0 auto;
      overflow-x: hidden;
      background: var(--nomadia-link-page);
      color: var(--nomadia-link-text);
      font-size: 15px;
      line-height: 1.6;
      isolation: isolate;
    }

    a { color: inherit; }

    [hidden] { display: none !important; }

    .page {
      position: relative;
      width: min(100%, 580px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 40px var(--nomadia-link-gap) 44px;
      background: var(--nomadia-link-page);
    }

    .profile {
      display: grid;
      justify-items: center;
      padding-top: 22px;
      text-align: center;
    }

    button,
    select {
      color: inherit;
      font: inherit;
    }

    .topbar {
      position: absolute;
      top: 14px;
      right: var(--nomadia-link-gap);
      left: var(--nomadia-link-gap);
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
    }

    .share-button,
    .language-control {
      min-height: 42px;
      border: 1px solid var(--nomadia-link-border);
      border-radius: var(--nomadia-link-radius);
      background: var(--nomadia-link-surface);
      color: var(--nomadia-link-text);
      pointer-events: auto;
      transition: background-color 160ms ease, color 160ms ease;
    }

    .language-control {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding-left: 10px;
    }

    .language-icon {
      position: static;
      width: 18px;
      height: 18px;
      color: inherit;
      pointer-events: none;
    }

    .language-select {
      min-width: 0;
      align-self: stretch;
      padding: 0 10px 0 0;
      border: 0;
      border-radius: var(--nomadia-link-radius);
      background: transparent;
      font-size: 13px;
      font-weight: 500;
    }

    .share-control {
      position: relative;
      pointer-events: auto;
    }

    .share-button {
      display: grid;
      width: 42px;
      padding: 0;
      place-items: center;
      cursor: pointer;
    }

    .share-button:hover,
    .language-control:hover {
      background: var(--nomadia-link-surface-inverse);
      color: var(--nomadia-link-text-inverse);
    }

    .share-button svg {
      width: 20px;
      height: 20px;
    }

    .share-status {
      position: absolute;
      top: 50px;
      right: 0;
      width: max-content;
      max-width: min(260px, calc(100vw - 28px));
      padding: 8px 10px;
      border: 1px solid var(--nomadia-link-border);
      border-radius: var(--nomadia-link-radius);
      background: var(--nomadia-link-status-surface);
      color: var(--nomadia-link-status-text);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .share-status[data-visible="true"] {
      opacity: 1;
      transform: translateY(0);
    }

    .avatar {
      width: 86px;
      height: 86px;
      border: 1px solid var(--nomadia-link-border);
      border-radius: 50%;
      object-fit: cover;
      background: var(--nomadia-link-avatar-surface);
    }

    h1 {
      margin: 16px 0 5px;
      color: var(--nomadia-link-text-strong);
      font-size: 22px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .bio {
      max-width: 360px;
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
    }

    .bio strong { font-weight: 500; }

    .socials {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .social-link {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: var(--nomadia-link-radius);
      background: var(--nomadia-link-surface);
      color: var(--nomadia-link-text);
      transition: background-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .social-link:hover {
      background: var(--nomadia-link-surface-inverse);
      color: var(--nomadia-link-text-inverse);
      transform: translateY(-1px);
    }

    .social-link:focus-visible { transform: none; }

    .social-link svg { width: 25px; height: 25px; }

    .threads-icon {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      font-size: 26px;
      font-weight: 500;
      line-height: 1;
    }

    .section { margin-top: 30px; }

    .section-title {
      margin: 0 0 12px;
      color: var(--nomadia-link-text);
      text-align: center;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: 0.01em;
    }

    .link-list {
      display: grid;
      gap: 9px;
    }

    .link-card {
      position: relative;
      display: grid;
      min-height: 58px;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--nomadia-link-border);
      border-radius: var(--nomadia-link-radius);
      background: var(--nomadia-link-surface);
      color: var(--nomadia-link-text);
      text-decoration: none;
      transition: background-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .link-card::after {
      width: 42px;
      content: "";
    }

    .link-card:hover {
      background: var(--nomadia-link-surface-inverse);
      color: var(--nomadia-link-text-inverse);
      transform: translateY(-1px);
    }

    .link-card:focus-visible { transform: none; }

    .link-icon {
      width: 38px;
      height: 38px;
      border-radius: 6px;
      object-fit: cover;
    }

    .link-label {
      text-align: center;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.35;
    }

    .simple-card {
      grid-template-columns: 1fr;
      min-height: 58px;
      padding-inline: 10px;
    }

    html:not([data-language="ko"]) .simple-card {
      background: var(--nomadia-link-surface-inverse);
      color: var(--nomadia-link-text-inverse);
    }

    html:not([data-language="ko"]) .simple-card:hover {
      background: var(--nomadia-link-surface);
      color: var(--nomadia-link-text);
    }

    html[data-language="ko"] .simple-card:hover {
      background: var(--nomadia-link-surface-inverse);
      color: var(--nomadia-link-text-inverse);
    }

    .simple-card::after { display: none; }

    .contact-card {
      grid-template-columns: 38px 1fr 38px;
      min-height: 64px;
    }

    .contact-card::after { width: 38px; }

    .mail-icon {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: inherit;
    }

    .mail-icon svg { width: 22px; height: 22px; }

    .contact-copy {
      text-align: center;
      line-height: 1.25;
    }

    .contact-title {
      display: block;
      color: inherit;
      font-size: 14px;
    }

    .contact-detail {
      display: block;
      margin-top: 3px;
      color: inherit;
      font-size: 12px;
    }

    footer {
      margin-top: 42px;
      text-align: center;
      color: var(--nomadia-link-text-muted);
      font-size: 12px;
      line-height: 1.5;
    }


    @media (min-width: 576px) {
      body {
        background: var(--nomadia-link-frame);
      }

      .page {
        z-index: 1;
        margin-top: 40px;
        border: 1px solid var(--nomadia-link-border);
        border-bottom: 0;
        border-radius: 14px 14px 0 0;
      }

      .section-title { font-size: 20px; }
    }

    @media (max-width: 360px) {
      .page { padding-inline: 10px; }
      .link-label { font-size: 13px; }
    }
  </style>
</head>

  <script>
    (() => {
      const countryApi = "https://api.country.is/";
      const siteBasePath = "/nomadia-link/";
      const supportedLanguages = new Set(["en", "ko", "ja"]);
      const params = new URLSearchParams(window.location.search);
      const translations = {
        en: {
          title: "NOMADIA Official Links",
          description: "NOMADIA official links for stores, business inquiries, and international availability updates.",
          ogLocale: "en_US",
          bioLead: "Derma skincare for sensitive skin 🥼🤍",
          bioSub: "exploring the unknowns of sensitive skin 🔍",
          waitlistTitle: "International Availability Updates",
          earlyAccess: "Notify Me When It’s Available",
          findTitle: "Where to find us",
          officialStore: "[KR] NOMADIA Official Store",
          naverStore: "[KR] NOMADIA Naver Smartstore",
          pharmacyMap: "[KR] Offline Pharmacy Stocklist",
          qoo10: "[JP] Qoo10 Official Store",
          business: "Business Inquiries",
          email: "Email",
          controlsLabel: "Page controls",
          languageLabel: "Language",
          skipToContent: "Skip to main content",
          shareLabel: "Share page",
          copied: "Link copied",
          copyFailed: "Copy the page URL from the address bar"
        },
        ko: {
          title: "NOMADIA 공식 링크",
          description: "NOMADIA의 구매처, 비즈니스 문의, 해외 구매 알림 공식 링크입니다.",
          ogLocale: "ko_KR",
          bioLead: "민감성 피부를 위한 더마 스킨케어 🥼🤍",
          bioSub: "민감성 피부의 미지의 영역을 탐구합니다 🔍",
          waitlistTitle: "해외 구매 알림받기",
          earlyAccess: "해외 구매 소식 먼저 받기",
          findTitle: "구매처",
          officialStore: "[KR] NOMADIA 공식 온라인 스토어",
          naverStore: "[KR] 네이버 스마트스토어",
          pharmacyMap: "[KR] 노마디아 입점 약국 지도",
          qoo10: "[JP] Qoo10 공식 스토어",
          business: "비즈니스 문의",
          email: "이메일",
          controlsLabel: "페이지 설정",
          languageLabel: "언어",
          skipToContent: "본문으로 건너뛰기",
          shareLabel: "페이지 공유",
          copied: "링크를 복사했습니다",
          copyFailed: "주소창에서 페이지 주소를 복사해 주세요"
        },
        ja: {
          title: "NOMADIA 公式リンク",
          description: "NOMADIAの購入先、ビジネスお問い合わせ、海外購入の最新情報をまとめた公式リンクです。",
          ogLocale: "ja_JP",
          bioLead: "敏感肌のためのダーマスキンケア 🥼🤍",
          bioSub: "敏感肌の未知を探求します 🔍",
          waitlistTitle: "海外購入の最新情報",
          earlyAccess: "販売開始のお知らせを受け取る",
          findTitle: "購入先",
          officialStore: "[韓国] NOMADIA公式ストア",
          naverStore: "[韓国] NAVERスマートストア",
          pharmacyMap: "[韓国] オフライン薬局マップ",
          qoo10: "[日本] Qoo10公式ストア",
          business: "ビジネスに関するお問い合わせ",
          email: "メール",
          controlsLabel: "ページ設定",
          languageLabel: "言語",
          skipToContent: "メインコンテンツへ移動",
          shareLabel: "ページを共有",
          copied: "リンクをコピーしました",
          copyFailed: "アドレスバーからページURLをコピーしてください"
        }
      };
      const socialProfiles = {
        en: {
          instagram: { href: "https://www.instagram.com/nomadiaskin", label: "NOMADIA Instagram" },
          secondary: { href: "https://www.tiktok.com/@nomadiaskin", label: "NOMADIA TikTok", icon: "tiktok" }
        },
        ko: {
          instagram: { href: "https://www.instagram.com/nomadiaskin.kr", label: "NOMADIA 한국어 Instagram" },
          secondary: { href: "https://www.threads.com/@nomadiaskin.kr", label: "NOMADIA 한국어 Threads", icon: "threads" }
        },
        ja: {
          instagram: { href: "https://www.instagram.com/nomadiaskin", label: "NOMADIA Instagram" },
          secondary: { href: "https://www.tiktok.com/@nomadiaskin", label: "NOMADIA TikTok", icon: "tiktok" }
        }
      };
      const sectionOrder = {
        GLOBAL: ["waitlist", "stores", "business"],
        KR: ["stores", "waitlist", "business"],
        JP: ["stores", "waitlist", "business"]
      };
      const storeOrder = {
        GLOBAL: ["official", "naver", "pharmacy", "qoo10"],
        KR: ["official", "naver", "pharmacy", "qoo10"],
        JP: ["qoo10", "official", "naver", "pharmacy"]
      };

      const normalizeLanguage = (value) => {
        const language = value?.toLowerCase().split("-")[0];
        return supportedLanguages.has(language) ? language : null;
      };

      const readSavedLanguage = () => {
        try {
          return normalizeLanguage(localStorage.getItem("nomadia-language"));
        } catch {
          return null;
        }
      };

      const saveLanguage = (language) => {
        try {
          localStorage.setItem("nomadia-language", language);
        } catch {
          // Language routing still works when browser storage is unavailable.
        }
      };

      const pathLanguage = () => {
        const relativePath = window.location.pathname.startsWith(siteBasePath)
          ? window.location.pathname.slice(siteBasePath.length)
          : "";
        const firstSegment = relativePath.split("/").filter(Boolean)[0];
        return firstSegment === "ko" || firstSegment === "ja" ? firstSegment : null;
      };

      const localeUrl = (language) => {
        const path = language === "en" ? siteBasePath : `${siteBasePath}${language}/`;
        const url = new URL(path, window.location.origin);
        for (const key of ["country", "market"]) {
          const value = params.get(key);
          if (value) url.searchParams.set(key, value);
        }
        return url;
      };

      const detectLanguage = () => {
        const fromPath = pathLanguage();
        if (fromPath) return fromPath;
        const requested = normalizeLanguage(params.get("lang"));
        if (requested) return requested;
        const saved = readSavedLanguage();
        if (saved) return saved;
        for (const locale of navigator.languages ?? [navigator.language]) {
          const language = normalizeLanguage(locale);
          if (language) return language;
        }
        return "en";
      };

      const isCrawler = () =>
        /bot|crawler|spider|crawling|facebookexternalhit|slackbot|twitterbot|linkedinbot|discordbot|whatsapp/i.test(navigator.userAgent);

      const canonicalizeLanguageUrl = (language) => {
        const expected = localeUrl(language);
        const current = new URL(window.location.href);
        const samePath = current.pathname === expected.pathname;
        const hasLegacyLanguage = current.searchParams.has("lang");
        if (!samePath || hasLegacyLanguage) {
          window.location.replace(expected);
          return true;
        }
        return false;
      };

      const normalizeMarket = (value) => {
        const country = value?.toUpperCase();
        if (country === "KR" || country === "JP") return country;
        return "GLOBAL";
      };

      const readCachedMarket = () => {
        try {
          const country = sessionStorage.getItem("nomadia-country");
          return country ? normalizeMarket(country) : null;
        } catch {
          return null;
        }
      };

      const cacheCountry = (country) => {
        try {
          sessionStorage.setItem("nomadia-country", country);
        } catch {
          // The page still works when browser storage is unavailable.
        }
      };

      const marketFromTimeZone = () => {
        try {
          const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
          if (timeZone === "Asia/Seoul") return "KR";
          if (timeZone === "Asia/Tokyo") return "JP";
        } catch {
          // Unknown time zones fall back to the global ordering.
        }
        return "GLOBAL";
      };

      const detectMarket = async () => {
        const override = params.get("country") ?? params.get("market");
        if (override) return { market: normalizeMarket(override), source: "url" };

        const cached = readCachedMarket();
        if (cached) return { market: cached, source: "cache" };

        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 3000);
        try {
          const response = await fetch(countryApi, {
            cache: "no-store",
            credentials: "omit",
            referrerPolicy: "no-referrer",
            signal: controller.signal
          });
          if (!response.ok) throw new Error(`Country lookup failed: ${response.status}`);
          const { country } = await response.json();
          if (typeof country !== "string") throw new Error("Country lookup returned no country");
          const market = normalizeMarket(country);
          cacheCountry(country);
          return { market, source: "api" };
        } catch {
          const market = marketFromTimeZone();
          return { market, source: market === "GLOBAL" ? "fallback" : "timezone" };
        } finally {
          window.clearTimeout(timeout);
        }
      };

      const applySocialProfiles = (language) => {
        const profiles = socialProfiles[language];
        const instagram = document.querySelector('[data-social="instagram"]');
        const secondary = document.querySelector('[data-social="secondary"]');
        instagram.href = profiles.instagram.href;
        instagram.setAttribute("aria-label", profiles.instagram.label);
        secondary.href = profiles.secondary.href;
        secondary.setAttribute("aria-label", profiles.secondary.label);
        for (const icon of secondary.querySelectorAll("[data-social-icon]")) {
          icon.toggleAttribute("hidden", icon.dataset.socialIcon !== profiles.secondary.icon);
        }
      };

      const applyLanguage = (language) => {
        const copy = translations[language];
        document.documentElement.lang = language;
        document.documentElement.dataset.language = language;
        document.title = copy.title;
        document.querySelector('meta[name="description"]').content = copy.description;
        document.querySelector('meta[property="og:title"]').content = copy.title;
        document.querySelector('meta[property="og:description"]').content = copy.description;
        document.querySelector('meta[property="og:locale"]').content = copy.ogLocale;
        document.querySelector('meta[name="twitter:title"]').content = copy.title;
        document.querySelector('meta[name="twitter:description"]').content = copy.description;
        for (const element of document.querySelectorAll("[data-i18n]")) {
          element.textContent = copy[element.dataset.i18n];
        }
        for (const element of document.querySelectorAll("[data-i18n-aria]")) {
          element.setAttribute("aria-label", copy[element.dataset.i18nAria]);
        }
        document.querySelector('[data-section="business"]').setAttribute("aria-label", copy.business);
        document.querySelector("#language-select").value = language;
        document.querySelector("#share-button").setAttribute("aria-label", copy.shareLabel);
        applySocialProfiles(language);
      };

      const applyMarket = (market) => {
        const main = document.querySelector("main");
        const footer = main.querySelector("footer");
        for (const sectionName of sectionOrder[market]) {
          main.insertBefore(main.querySelector(`[data-section="${sectionName}"]`), footer);
        }

        const storePriority = storeOrder[market];
        const storeList = main.querySelector('[data-section="stores"] .link-list');
        const storeCards = [...storeList.querySelectorAll("[data-store]")];
        storeCards
          .sort((left, right) =>
            storePriority.indexOf(left.dataset.store) -
            storePriority.indexOf(right.dataset.store)
          )
          .forEach((card) => storeList.append(card));
      };

      const languageSelect = document.querySelector("#language-select");
      const shareButton = document.querySelector("#share-button");
      const shareStatus = document.querySelector("#share-status");
      let shareStatusTimeout;

      const announceShareStatus = (message) => {
        window.clearTimeout(shareStatusTimeout);
        shareStatus.textContent = message;
        shareStatus.dataset.visible = "true";
        shareStatusTimeout = window.setTimeout(() => {
          shareStatus.dataset.visible = "false";
        }, 2400);
      };

      const currentShareUrl = () =>
        localeUrl(document.documentElement.dataset.language || detectLanguage()).href;

      const copyShareUrl = async (url) => {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(url);
          return true;
        }
        const input = document.createElement("textarea");
        input.value = url;
        input.setAttribute("readonly", "");
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.append(input);
        input.select();
        const copied = document.execCommand("copy");
        input.remove();
        return copied;
      };

      languageSelect.addEventListener("change", () => {
        const language = normalizeLanguage(languageSelect.value) || "en";
        saveLanguage(language);
        window.location.assign(localeUrl(language));
      });

      shareButton.addEventListener("click", async () => {
        const language = document.documentElement.dataset.language || detectLanguage();
        const copy = translations[language];
        const url = currentShareUrl();
        if (typeof navigator.share === "function") {
          try {
            await navigator.share({ title: copy.title, text: copy.description, url });
            return;
          } catch (error) {
            if (error?.name === "AbortError") return;
          }
        }
        try {
          const copied = await copyShareUrl(url);
          announceShareStatus(copied ? copy.copied : copy.copyFailed);
        } catch {
          announceShareStatus(copy.copyFailed);
        }
      });

      const start = async () => {
        const language = isCrawler() && !pathLanguage() ? "en" : detectLanguage();
        if (canonicalizeLanguageUrl(language)) return;
        applyLanguage(language);
        const { market, source } = await detectMarket();
        applyMarket(market);
        document.documentElement.dataset.language = language;
        document.documentElement.dataset.market = market.toLowerCase();
        document.documentElement.dataset.countrySource = source;
      };

      start();
    })();
  </script>
</body>
</html>
